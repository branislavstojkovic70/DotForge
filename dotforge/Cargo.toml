[workspace]
members = [
    "crates/core",
    "crates/contract",
    "crates/backend",
    "crates/cli",
]
resolver = "2"

[workspace.dependencies]
tokio      = { version = "1", features = ["full"] }
axum       = "0.7"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
blake3     = "1"
walkdir    = "2"