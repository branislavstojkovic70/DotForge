[package]
name = "dotforge-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio              = { version = "1", features = ["full"] }
axum               = "0.7"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
anyhow             = "1"
reqwest            = { version = "0.12", features = ["json", "multipart"] }
sha2               = "0.10"
hex                = "0.4"
tracing            = "0.1"
tracing-subscriber = "0.3"
dotenvy            = "0.15"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm      = "0.10"
rand         = "0.8"